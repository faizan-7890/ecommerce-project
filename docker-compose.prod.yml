

services:
  # 1. MySQL 8 Database Service
  db:
    image: mysql:8.0
    container_name: veloce-db-prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      MYSQL_DATABASE: veloce_db
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER must be set}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
    volumes:
      - veloce_mysql_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. FastAPI Production Backend (Gunicorn + Uvicorn Workers)
  backend:
    build:
      context: ./backend-fastapi
      dockerfile: Dockerfile
    container_name: veloce-backend-prod
    command: gunicorn -w 4 -k uvicorn.workers.UvicornWorker main:app --bind 0.0.0.0:8000
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER:?MYSQL_USER must be set}:${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}@db:3306/veloce_db
      - FRONTEND_URL=${FRONTEND_URL:?FRONTEND_URL must be set}
      - NODE_ENV=production
    env_file:
      - ./backend-fastapi/.env
    depends_on:
      db:
        condition: service_healthy

  # 3. Next.js Standalone Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL must be set}
    container_name: veloce-frontend-prod
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production

    depends_on:
      - backend

volumes:
  veloce_mysql_prod_data:
